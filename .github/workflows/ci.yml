
name: NovaStore CI

on:
  push:
    branches:
      - develop
      - feature/retail-fullstack
  pull_request:
    branches:
      - develop

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 123456789012.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: novastore-dev-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: novastore
          POSTGRES_USER: novastore
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novastore -d novastore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/novastore
      DB_USERNAME: novastore
      DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Scan repository secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Test and package backend
        working-directory: app
        run: mvn --batch-mode clean verify

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: novastore-backend-jar
          path: app/target/*.jar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: novastore-frontend
          path: frontend/dist/

      - name: Build backend Docker image
        working-directory: app
        run: docker build -t novastore-api:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: novastore-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

  publish-to-ecr:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: novastore-backend-jar
          path: app/target/

      - name: Build backend Docker image
        working-directory: app
        run: docker build -t novastore-api:${{ github.sha }} .

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/novastore-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image to ECR
        run: |
          docker tag novastore-api:${{ github.sha }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
