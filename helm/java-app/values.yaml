replicaCount: 2

image:
  repository: 123456789012.dkr.ecr.us-east-2.amazonaws.com/novastore-dev-app
  tag: "215b16fb43669bfb6e516f44d459b0744464d03f"
  pullPolicy: IfNotPresent

container:
  port: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

probes:
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 20

config:
  environment: dev

ingress:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

secret:
  enabled: false
